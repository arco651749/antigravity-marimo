<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marimo Notebook - Antigravity</title>
  <script src="/preload.js"></script>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-hover: #334155;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-green: #10b981;
      --accent-yellow: #f59e0b;
      --accent-red: #ef4444;
      --accent-blue: #38bdf8;
      --accent-purple: #a855f7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Navigation Toolbar */
    .toolbar {
      height: 44px;
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      gap: 8px;
      user-select: none;
      z-index: 10;
      flex-shrink: 0;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .brand-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .brand-title {
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .pills-group {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .workspace-pill, .session-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background-color: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: default;
    }

    .workspace-pill {
      max-width: 120px;
    }

    .session-pill {
      max-width: 110px;
      border-color: rgba(168, 85, 247, 0.4);
      color: var(--accent-purple);
      background-color: rgba(168, 85, 247, 0.08);
    }

    .notebook-selector-container {
      flex: 1;
      max-width: 280px;
      display: flex;
      align-items: center;
    }

    .notebook-select {
      width: 100%;
      background-color: var(--bg-primary);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
      transition: border-color 0.15s ease;
    }

    .notebook-select:focus {
      border-color: var(--accent-green);
    }

    .actions-section {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 9999px;
      background-color: rgba(16, 185, 129, 0.1);
      color: var(--accent-green);
      font-weight: 500;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--accent-green);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    .btn-icon {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      transition: all 0.15s ease;
    }

    .btn-icon:hover {
      background-color: var(--bg-hover);
      color: var(--text-main);
      border-color: var(--border-color);
    }

    .btn-icon svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Main Viewport */
    .viewport {
      flex: 1;
      position: relative;
      background-color: #ffffff;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Overlay / Loading State */
    .overlay {
      position: absolute;
      inset: 0;
      background-color: var(--bg-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 5;
      transition: opacity 0.2s ease;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(16, 185, 129, 0.2);
      border-top-color: var(--accent-green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .overlay-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-main);
    }

    .overlay-desc {
      font-size: 12px;
      color: var(--text-muted);
      max-width: 260px;
      text-align: center;
      line-height: 1.5;
    }

    .btn-primary {
      background-color: var(--accent-green);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.15s ease;
    }

    .btn-primary:hover {
      background-color: #059669;
    }
  </style>
</head>
<body>
  <!-- Top Navigation Toolbar -->
  <header class="toolbar">
    <div class="brand-section">
      <svg class="brand-icon" viewBox="0 0 128 128">
        <circle cx="64" cy="64" r="60" fill="#10b981" />
        <circle cx="40" cy="48" r="14" fill="#ffffff" />
        <circle cx="88" cy="48" r="14" fill="#ffffff" />
        <circle cx="64" cy="92" r="18" fill="#ffffff" />
      </svg>
      <span class="brand-title">Marimo</span>
    </div>

    <!-- Workspace & Session Pills -->
    <div class="pills-group">
      <div id="workspacePill" class="workspace-pill" title="目前專案工作目錄">
        <span class="ws-icon">📁</span>
        <span id="workspaceName" class="ws-name">專案...</span>
      </div>

      <div id="sessionPill" class="session-pill" title="當前獨立會話">
        <span class="chat-icon">💬</span>
        <span id="sessionName" class="session-name">會話獨立</span>
      </div>
    </div>

    <!-- Active Notebook Selector -->
    <div class="notebook-selector-container">
      <select id="notebookSelect" class="notebook-select" title="切換當前編輯的筆記本 (即時無延遲)">
        <option value="">正在載入筆記本清單...</option>
      </select>
    </div>

    <div class="actions-section">
      <div id="statusBadge" class="status-badge">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText">連線中</span>
      </div>

      <button id="btnReload" class="btn-icon" title="重新整理當前筆記本畫面">
        <svg viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>

      <button id="btnHome" class="btn-icon" title="查看工作區首頁與筆記清單">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </button>

      <button id="btnRestart" class="btn-icon" title="強制重啟 Marimo 伺服器">
        <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </button>

      <button id="btnExternal" class="btn-icon" title="在外部瀏覽器打開此筆記本">
        <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      </button>
    </div>
  </header>

  <!-- Main Viewport -->
  <main class="viewport">
    <div id="overlay" class="overlay">
      <div class="spinner"></div>
      <div id="overlayTitle" class="overlay-title">正在連接 Marimo 服務...</div>
      <div id="overlayDesc" class="overlay-desc">正在啟動背景目錄工作區伺服器 (Port 2718)</div>
      <button id="btnStartServer" class="btn-primary" style="display: none;">啟動 Marimo 服務</button>
    </div>
    <iframe id="marimoFrame" src="about:blank"></iframe>
  </main>

  <script>
    const MARIMO_BASE_URL = "http://127.0.0.1:2718";
    const iframe = document.getElementById("marimoFrame");
    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlayTitle");
    const overlayDesc = document.getElementById("overlayDesc");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const statusBadge = document.getElementById("statusBadge");
    const workspaceName = document.getElementById("workspaceName");
    const workspacePill = document.getElementById("workspacePill");
    const sessionName = document.getElementById("sessionName");
    const sessionPill = document.getElementById("sessionPill");
    const notebookSelect = document.getElementById("notebookSelect");
    const btnReload = document.getElementById("btnReload");
    const btnHome = document.getElementById("btnHome");
    const btnRestart = document.getElementById("btnRestart");
    const btnExternal = document.getElementById("btnExternal");
    const btnStartServer = document.getElementById("btnStartServer");

    let isConnected = false;
    let currentNotebook = "";
    let currentWorkspaceUri = null;
    let currentConvId = null;

    // Detect conversation ID from sidecar preload bridge or URL query
    function getConversationId() {
      if (window.sidecar && window.sidecar.conversationId) {
        return window.sidecar.conversationId;
      }
      const params = new URLSearchParams(window.location.search);
      return params.get("conversationId") || null;
    }

    currentConvId = getConversationId();
    if (currentConvId) {
      const shortId = currentConvId.replace(/[^a-zA-Z0-9]/g, '').slice(0, 8);
      sessionName.textContent = `會話 ${shortId}`;
      sessionPill.title = `獨立會話 ID: ${currentConvId}`;
    }

    function apiFetch(url, options = {}) {
      if (window.sidecar && typeof window.sidecar.fetch === "function") {
        return window.sidecar.fetch(url, options);
      }
      return fetch(url, options);
    }

    function getTargetUrl(fileRel) {
      if (!fileRel) return MARIMO_BASE_URL;
      return MARIMO_BASE_URL + "/?file=" + encodeURIComponent(fileRel);
    }

    async function syncWorkspace(uri) {
      if (!uri) return;
      currentWorkspaceUri = uri;
      try {
        const res = await apiFetch("/api/workspace", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            uri, 
            conversationId: currentConvId 
          })
        });
        if (res.ok) {
          const data = await res.json();
          workspaceName.textContent = data.workspaceName || "專案工作區";
          workspacePill.title = data.workspaceRoot || uri;
          updateNotebooksDropdown(data.notebooks, data.activeNotebookRel);
          if (data.activeNotebookRel) {
            iframe.src = getTargetUrl(data.activeNotebookRel);
          }
        }
      } catch (err) {
        console.warn("Failed to sync workspace:", err);
      }
    }

    async function checkStatus() {
      try {
        const res = await apiFetch("/api/status", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ conversationId: currentConvId })
        });
        if (!res.ok) throw new Error("HTTP error " + res.status);
        const data = await res.json();
        
        if (data.workspaceName) {
          workspaceName.textContent = data.workspaceName;
          workspacePill.title = data.workspaceRoot;
        }

        updateNotebooksDropdown(data.notebooks, data.activeNotebookRel);

        if (data.running) {
          if (!isConnected) {
            isConnected = true;
            statusText.textContent = "運作中";
            statusDot.style.backgroundColor = "var(--accent-green)";
            statusBadge.style.color = "var(--accent-green)";
            statusBadge.style.backgroundColor = "rgba(16, 185, 129, 0.1)";
            overlay.classList.add("hidden");
            btnStartServer.style.display = "none";
            
            // Initial load with current conversation's active notebook
            if (iframe.src === "about:blank" || !iframe.src.includes("2718")) {
              iframe.src = getTargetUrl(data.activeNotebookRel);
            }
          }
        } else {
          isConnected = false;
          statusText.textContent = "已停止";
          statusDot.style.backgroundColor = "var(--accent-red)";
          statusBadge.style.color = "var(--accent-red)";
          statusBadge.style.backgroundColor = "rgba(239, 68, 68, 0.1)";
          overlayTitle.textContent = "Marimo 服務未在執行";
          overlayDesc.textContent = "點擊下方按鈕啟動背景 Marimo 核心服務。";
          btnStartServer.style.display = "inline-flex";
          overlay.classList.remove("hidden");
        }
      } catch (err) {
        console.warn("Status poll error:", err);
        statusText.textContent = "連線中斷";
        statusDot.style.backgroundColor = "var(--accent-yellow)";
      }
    }

    function updateNotebooksDropdown(notebooks, activeRel) {
      if (!notebooks || notebooks.length === 0) {
        notebookSelect.innerHTML = '<option value="">無可用筆記本 (新建中...)</option>';
        return;
      }
      
      const prevVal = notebookSelect.value;
      const countChanged = notebookSelect.options.length !== notebooks.length;
      
      if (countChanged || !notebookSelect.value) {
        notebookSelect.innerHTML = "";
        notebooks.forEach(nb => {
          const opt = document.createElement("option");
          opt.value = nb.relativePath;
          opt.textContent = nb.displayName || nb.name;
          if (nb.role === 'current_session') {
            opt.style.fontWeight = 'bold';
            opt.style.color = 'var(--accent-purple)';
          }
          if (nb.relativePath === (activeRel || prevVal)) {
            opt.selected = true;
          }
          notebookSelect.appendChild(opt);
        });
      }
      currentNotebook = activeRel || notebookSelect.value;
    }

    // Instant switch without server kill or artificial delay
    notebookSelect.addEventListener("change", async (e) => {
      const selected = e.target.value;
      if (!selected || selected === currentNotebook) return;
      
      currentNotebook = selected;
      const targetUrl = getTargetUrl(selected);

      // Instantly navigate iframe
      iframe.src = targetUrl;

      // Notify backend
      apiFetch("/api/switch-notebook", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ 
          notebook: selected, 
          conversationId: currentConvId 
        })
      }).catch(console.warn);
    });

    btnReload.addEventListener("click", () => {
      iframe.src = getTargetUrl(currentNotebook);
    });

    btnHome.addEventListener("click", () => {
      iframe.src = MARIMO_BASE_URL + "/";
    });

    btnRestart.addEventListener("click", async () => {
      overlayTitle.textContent = "正在重啟 Marimo 伺服器...";
      overlayDesc.textContent = "正在重新啟動核心服務...";
      overlay.classList.remove("hidden");
      try {
        await apiFetch("/api/restart", { method: "POST" });
        setTimeout(() => {
          iframe.src = getTargetUrl(currentNotebook);
          checkStatus();
        }, 1200);
      } catch (err) {
        alert("重啟失敗: " + err.message);
      }
    });

    btnStartServer.addEventListener("click", async () => {
      overlayTitle.textContent = "正在啟動 Marimo...";
      btnStartServer.style.display = "none";
      try {
        await apiFetch("/api/start", { method: "POST" });
        setTimeout(checkStatus, 1200);
      } catch (err) {
        alert("啟動失敗: " + err.message);
        btnStartServer.style.display = "inline-flex";
      }
    });

    btnExternal.addEventListener("click", () => {
      window.open(getTargetUrl(currentNotebook), "_blank");
    });

    // Sidecar Workspace Hook initialization
    if (window.sidecar) {
      if (typeof window.sidecar.getWorkspaceUris === 'function') {
        window.sidecar.getWorkspaceUris().then(uris => {
          if (uris && uris.length > 0) {
            syncWorkspace(uris[0]);
          }
        }).catch(console.warn);
      }
      if (typeof window.sidecar.onWorkspaceChange === 'function') {
        window.sidecar.onWorkspaceChange((newUris) => {
          if (newUris && newUris.length > 0) {
            syncWorkspace(newUris[0]);
          }
        });
      }
    }

    // Start polling
    checkStatus();
    setInterval(checkStatus, 3000);
  </script>
</body>
</html>
