<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marimo Notebook - Antigravity</title>
  <script src="/preload.js"></script>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-hover: #334155;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-green: #10b981;
      --accent-yellow: #f59e0b;
      --accent-red: #ef4444;
      --accent-blue: #38bdf8;
      --accent-purple: #a855f7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Navigation Toolbar */
    .toolbar {
      height: 44px;
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      gap: 8px;
      user-select: none;
      z-index: 10;
      flex-shrink: 0;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .brand-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .brand-title {
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .pills-group {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .workspace-pill, .session-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background-color: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: default;
    }

    .workspace-pill {
      max-width: 120px;
    }

    .session-pill {
      max-width: 110px;
      border-color: rgba(168, 85, 247, 0.4);
      color: var(--accent-purple);
      background-color: rgba(168, 85, 247, 0.08);
    }

    .notebook-selector-container {
      flex: 1;
      max-width: 280px;
      display: flex;
      align-items: center;
    }

    .notebook-select {
      width: 100%;
      background-color: var(--bg-primary);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
      transition: border-color 0.15s ease;
    }

    .notebook-select:focus {
      border-color: var(--accent-green);
    }

    .actions-section {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 9999px;
      background-color: rgba(16, 185, 129, 0.1);
      color: var(--accent-green);
      font-weight: 500;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--accent-green);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    .btn-icon {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      transition: all 0.15s ease;
    }

    .btn-icon:hover {
      background-color: var(--bg-hover);
      color: var(--text-main);
      border-color: var(--border-color);
    }

    .btn-icon svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Main Viewport */
    .viewport {
      flex: 1;
      position: relative;
      background-color: #ffffff;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Overlay / Loading State */
    .overlay {
      position: absolute;
      inset: 0;
      background-color: var(--bg-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 5;
      transition: opacity 0.2s ease;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(16, 185, 129, 0.2);
      border-top-color: var(--accent-green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .overlay-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-main);
    }

    .overlay-desc {
      font-size: 12px;
      color: var(--text-muted);
      max-width: 260px;
      text-align: center;
      line-height: 1.5;
    }

    .btn-primary {
      background-color: var(--accent-green);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.15s ease;
    }

    .btn-primary:hover {
      background-color: #059669;
    }

    /* Modal Dialog */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      animation: modalFadeIn 0.15s ease-out;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      width: 90%;
      max-width: 360px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: modalScaleIn 0.15s ease-out;
    }

    @keyframes modalScaleIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }

    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .modal-close:hover {
      background: var(--bg-hover);
      color: var(--text-main);
    }

    .modal-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .modal-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .modal-input {
      background-color: var(--bg-primary);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .modal-input:focus {
      border-color: var(--accent-green);
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
    }

    .modal-hint {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      line-height: 1.4;
    }

    .modal-hint code {
      background: var(--bg-primary);
      padding: 2px 4px;
      border-radius: 3px;
      color: var(--accent-purple);
      font-size: 10px;
    }

    .modal-error {
      font-size: 12px;
      color: var(--accent-red);
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 4px;
      padding: 6px 10px;
      margin-top: 4px;
    }

    .modal-footer {
      padding: 12px 16px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      background: rgba(15, 23, 42, 0.4);
      border-top: 1px solid var(--border-color);
    }

    .modal-btn {
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }

    .modal-btn-secondary {
      background: transparent;
      border-color: var(--border-color);
      color: var(--text-muted);
    }

    .modal-btn-secondary:hover {
      background: var(--bg-hover);
      color: var(--text-main);
    }

    .modal-btn-primary {
      background: var(--accent-green);
      color: #ffffff;
    }

    .modal-btn-primary:hover {
      background: #059669;
    }

    .modal-btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <!-- Top Navigation Toolbar -->
  <header class="toolbar">
    <div class="brand-section">
      <svg class="brand-icon" viewBox="0 0 128 128">
        <circle cx="64" cy="64" r="60" fill="#10b981" />
        <circle cx="40" cy="48" r="14" fill="#ffffff" />
        <circle cx="88" cy="48" r="14" fill="#ffffff" />
        <circle cx="64" cy="92" r="18" fill="#ffffff" />
      </svg>
      <span class="brand-title">Marimo</span>
    </div>

    <!-- Workspace & Session Pills -->
    <div class="pills-group">
      <div id="workspacePill" class="workspace-pill" title="目前專案工作目錄">
        <span class="ws-icon">📁</span>
        <span id="workspaceName" class="ws-name">專案...</span>
      </div>

      <div id="sessionPill" class="session-pill" title="當前獨立會話">
        <span class="chat-icon">💬</span>
        <span id="sessionName" class="session-name">會話獨立</span>
      </div>
    </div>

    <!-- Active Notebook Selector -->
    <div class="notebook-selector-container">
      <select id="notebookSelect" class="notebook-select" title="切換當前會話內的筆記本">
        <option value="">正在載入會話筆記本...</option>
      </select>
      <button id="btnNewNotebook" class="btn-icon" title="在此會話建立新的 Python 筆記本" style="margin-left: 4px; font-weight: bold; font-size: 15px;">
        +
      </button>
    </div>

    <div class="actions-section">
      <div id="statusBadge" class="status-badge">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText">連線中</span>
      </div>

      <button id="btnReload" class="btn-icon" title="重新整理當前筆記本畫面">
        <svg viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>

      <button id="btnHome" class="btn-icon" title="查看工作區首頁與筆記清單">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </button>

      <button id="btnRestart" class="btn-icon" title="強制重啟 Marimo 伺服器">
        <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </button>

      <button id="btnExternal" class="btn-icon" title="在外部瀏覽器打開此筆記本">
        <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      </button>
    </div>
  </header>

  <!-- Create Notebook Modal Dialog -->
  <div id="newNotebookModal" class="modal-backdrop" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">新增會話筆記本</h3>
        <button id="modalCloseBtn" class="modal-close" type="button" title="關閉">&times;</button>
      </div>
      <div class="modal-body">
        <label for="newNotebookInput" class="modal-label">檔案名稱 (.py)</label>
        <input 
          id="newNotebookInput" 
          type="text" 
          class="modal-input" 
          placeholder="例如: data_analysis.py 或 my_tool"
          autocomplete="off"
          spellcheck="false"
        />
        <p class="modal-hint">獨立儲存於當前會話目錄 <code>.marimo/&lt;session_id&gt;/</code></p>
        <div id="modalErrorMsg" class="modal-error" style="display: none;"></div>
      </div>
      <div class="modal-footer">
        <button id="modalCancelBtn" class="modal-btn modal-btn-secondary" type="button">取消</button>
        <button id="modalSubmitBtn" class="modal-btn modal-btn-primary" type="button">建立筆記本</button>
      </div>
    </div>
  </div>

  <!-- Main Viewport -->
  <main class="viewport">
    <div id="overlay" class="overlay">
      <div class="spinner"></div>
      <div id="overlayTitle" class="overlay-title">正在連接 Marimo 服務...</div>
      <div id="overlayDesc" class="overlay-desc">正在啟動背景目錄工作區伺服器 (Port 2718)</div>
      <button id="btnStartServer" class="btn-primary" style="display: none;">啟動 Marimo 服務</button>
    </div>
    <iframe id="marimoFrame" src="about:blank"></iframe>
  </main>

  <script>
    let currentBaseUrl = "http://127.0.0.1:2718";
    const iframe = document.getElementById("marimoFrame");
    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlayTitle");
    const overlayDesc = document.getElementById("overlayDesc");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const statusBadge = document.getElementById("statusBadge");
    const workspaceName = document.getElementById("workspaceName");
    const workspacePill = document.getElementById("workspacePill");
    const sessionName = document.getElementById("sessionName");
    const sessionPill = document.getElementById("sessionPill");
    const notebookSelect = document.getElementById("notebookSelect");
    const btnNewNotebook = document.getElementById("btnNewNotebook");
    const btnReload = document.getElementById("btnReload");
    const btnHome = document.getElementById("btnHome");
    const btnRestart = document.getElementById("btnRestart");
    const btnExternal = document.getElementById("btnExternal");
    const btnStartServer = document.getElementById("btnStartServer");
    const newNotebookModal = document.getElementById("newNotebookModal");
    const newNotebookInput = document.getElementById("newNotebookInput");
    const modalCloseBtn = document.getElementById("modalCloseBtn");
    const modalCancelBtn = document.getElementById("modalCancelBtn");
    const modalSubmitBtn = document.getElementById("modalSubmitBtn");
    const modalErrorMsg = document.getElementById("modalErrorMsg");

    let isConnected = false;
    let currentNotebook = "";
    let currentWorkspaceUri = null;
    let currentConvId = null;

    // Detect conversation ID from sidecar preload bridge or URL query
    function getConversationId() {
      if (window.sidecar && window.sidecar.conversationId) {
        return window.sidecar.conversationId;
      }
      const params = new URLSearchParams(window.location.search);
      return params.get("conversationId") || null;
    }

    currentConvId = getConversationId();
    if (currentConvId) {
      const shortId = currentConvId.replace(/[^a-zA-Z0-9]/g, '').slice(0, 8);
      sessionName.textContent = `會話 ${shortId}`;
      sessionPill.title = `獨立會話 ID: ${currentConvId}`;
    }

    function apiFetch(url, options = {}) {
      if (window.sidecar && typeof window.sidecar.fetch === "function") {
        return window.sidecar.fetch(url, options);
      }
      return fetch(url, options);
    }

    function getTargetUrl(fileRel, forceRefresh = false) {
      const base = currentBaseUrl || "http://127.0.0.1:2718";
      if (!fileRel) return base;
      let url = base + "/?file=" + encodeURIComponent(fileRel);
      if (forceRefresh) {
        url += "&_t=" + Date.now();
      }
      return url;
    }

    async function syncWorkspace(uri) {
      if (!uri) return;
      currentWorkspaceUri = uri;
      try {
        const res = await apiFetch("/api/workspace", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            uri, 
            conversationId: currentConvId 
          })
        });
        if (res.ok) {
          const data = await res.json();
          if (data.url) currentBaseUrl = data.url;
          else if (data.port) currentBaseUrl = `http://127.0.0.1:${data.port}`;

          workspaceName.textContent = data.workspaceName || "專案工作區";
          workspacePill.title = data.workspaceRoot || uri;
          updateNotebooksDropdown(data.notebooks, data.activeNotebookRel);
          if (data.activeNotebookRel) {
            navigateToNotebook(data.activeNotebookRel, true);
          }
        }
      } catch (err) {
        console.warn("Failed to sync workspace:", err);
      }
    }

    async function checkStatus() {
      try {
        const res = await apiFetch("/api/status", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            conversationId: currentConvId,
            workspaceUri: currentWorkspaceUri
          })
        });
        if (!res.ok) throw new Error("HTTP error " + res.status);
        const data = await res.json();
        
        if (data.url) currentBaseUrl = data.url;
        else if (data.port) currentBaseUrl = `http://127.0.0.1:${data.port}`;

        if (data.workspaceName) {
          workspaceName.textContent = data.workspaceName;
          workspacePill.title = data.workspaceRoot;
        }

        updateNotebooksDropdown(data.notebooks, data.activeNotebookRel);

        if (data.running) {
          if (!isConnected) {
            isConnected = true;
            statusText.textContent = "運作中";
            statusDot.style.backgroundColor = "var(--accent-green)";
            statusBadge.style.color = "var(--accent-green)";
            statusBadge.style.backgroundColor = "rgba(16, 185, 129, 0.1)";
            overlay.classList.add("hidden");
            btnStartServer.style.display = "none";
            
            if (iframe.src === "about:blank" || !iframe.src.includes(currentBaseUrl)) {
              navigateToNotebook(currentNotebook || data.activeNotebookRel, true);
            }
          }
        } else {
          isConnected = false;
          statusText.textContent = "未啟動";
          statusDot.style.backgroundColor = "var(--accent-red)";
          statusBadge.style.color = "var(--accent-red)";
          statusBadge.style.backgroundColor = "rgba(239, 68, 68, 0.1)";
          overlayTitle.textContent = "Marimo 服務未在執行";
          overlayDesc.textContent = "點擊下方按鈕啟動背景 Marimo 核心服務。";
          btnStartServer.style.display = "inline-flex";
          overlay.classList.remove("hidden");
        }
      } catch (err) {
        console.warn("Status poll error:", err);
        statusText.textContent = "連線中斷";
        statusDot.style.backgroundColor = "var(--accent-yellow)";
      }
    }

    function navigateToNotebook(notebookRel, force = true) {
      if (!notebookRel) return;
      currentNotebook = notebookRel;
      if (notebookSelect.value !== notebookRel) {
        notebookSelect.value = notebookRel;
      }
      iframe.src = getTargetUrl(notebookRel, force);

      apiFetch("/api/switch-notebook", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ 
          notebook: notebookRel, 
          conversationId: currentConvId,
          workspaceUri: currentWorkspaceUri
        })
      }).catch(console.warn);
    }

    function updateNotebooksDropdown(notebooks, serverActiveRel) {
      if (!notebooks || notebooks.length === 0) {
        notebookSelect.innerHTML = '<option value="">無可用筆記本 (新建中...)</option>';
        return;
      }

      // Prioritize current selection if valid in list, else server active notebook, else 1st notebook
      let targetVal = currentNotebook;
      const currentValid = notebooks.some(nb => nb.relativePath === targetVal);
      if (!targetVal || !currentValid) {
        targetVal = serverActiveRel || notebooks[0].relativePath;
        currentNotebook = targetVal;
      }

      const currentOptions = Array.from(notebookSelect.options).map(o => o.value);
      const newOptions = notebooks.map(nb => nb.relativePath);
      const isSameList = currentOptions.length === newOptions.length &&
                         currentOptions.every((val, idx) => val === newOptions[idx]);

      if (!isSameList) {
        notebookSelect.innerHTML = "";
        notebooks.forEach(nb => {
          const opt = document.createElement("option");
          opt.value = nb.relativePath;
          opt.textContent = nb.displayName || nb.name;
          if (nb.role === 'current_session') {
            opt.style.fontWeight = 'bold';
            opt.style.color = 'var(--accent-purple)';
          } else if (nb.role === 'shared_toolbox') {
            opt.style.fontWeight = 'bold';
            opt.style.color = 'var(--accent-blue)';
          }
          if (nb.relativePath === targetVal) {
            opt.selected = true;
          }
          notebookSelect.appendChild(opt);
        });
      }

      if (notebookSelect.value !== targetVal) {
        notebookSelect.value = targetVal;
      }
    }

    // Direct switch with guaranteed reload and backend sync
    notebookSelect.addEventListener("change", (e) => {
      const selected = e.target.value;
      if (!selected) return;
      navigateToNotebook(selected, true);
    });

    btnReload.addEventListener("click", () => {
      navigateToNotebook(currentNotebook || notebookSelect.value, true);
    });

    function openNewNotebookModal() {
      newNotebookInput.value = "";
      modalErrorMsg.style.display = "none";
      modalErrorMsg.textContent = "";
      modalSubmitBtn.disabled = false;
      modalSubmitBtn.textContent = "建立筆記本";
      newNotebookModal.style.display = "flex";
      setTimeout(() => newNotebookInput.focus(), 50);
    }

    function closeNewNotebookModal() {
      newNotebookModal.style.display = "none";
    }

    async function handleCreateNotebook() {
      const name = newNotebookInput.value.trim();
      if (!name) {
        modalErrorMsg.textContent = "請輸入筆記本檔案名稱 (例如: my_tool.py)";
        modalErrorMsg.style.display = "block";
        newNotebookInput.focus();
        return;
      }

      if (name.toLowerCase() === "marimo.py") {
        modalErrorMsg.textContent = "請勿命名為 marimo.py，會導致 Python 模組循環引用衝突！";
        modalErrorMsg.style.display = "block";
        return;
      }

      modalSubmitBtn.disabled = true;
      modalSubmitBtn.textContent = "建立中...";
      modalErrorMsg.style.display = "none";

      try {
        const res = await apiFetch("/api/new-notebook", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            name, 
            conversationId: currentConvId 
          })
        });
        if (!res.ok) throw new Error("伺服器回應錯誤 (" + res.status + ")");
        const data = await res.json();
        
        closeNewNotebookModal();
        updateNotebooksDropdown(data.notebooks, data.activeNotebookRel);
        if (data.activeNotebookRel) {
          navigateToNotebook(data.activeNotebookRel, true);
        }
      } catch (err) {
        modalErrorMsg.textContent = "建立失敗: " + (err.message || err);
        modalErrorMsg.style.display = "block";
        modalSubmitBtn.disabled = false;
        modalSubmitBtn.textContent = "建立筆記本";
      }
    }

    btnNewNotebook.addEventListener("click", openNewNotebookModal);
    modalCloseBtn.addEventListener("click", closeNewNotebookModal);
    modalCancelBtn.addEventListener("click", closeNewNotebookModal);
    modalSubmitBtn.addEventListener("click", handleCreateNotebook);

    newNotebookModal.addEventListener("click", (e) => {
      if (e.target === newNotebookModal) {
        closeNewNotebookModal();
      }
    });

    newNotebookInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        handleCreateNotebook();
      } else if (e.key === "Escape") {
        e.preventDefault();
        closeNewNotebookModal();
      }
    });

    btnHome.addEventListener("click", () => {
      iframe.src = currentBaseUrl + "/";
    });

    btnRestart.addEventListener("click", async () => {
      overlayTitle.textContent = "正在重啟 Marimo 伺服器...";
      overlayDesc.textContent = "正在重新啟動核心服務...";
      overlay.classList.remove("hidden");
      try {
        await apiFetch("/api/restart", { 
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            conversationId: currentConvId,
            workspaceUri: currentWorkspaceUri
          })
        });
        setTimeout(() => {
          iframe.src = getTargetUrl(currentNotebook, true);
          checkStatus();
        }, 1200);
      } catch (err) {
        overlayTitle.textContent = "重啟失敗";
        overlayDesc.textContent = err.message || "伺服器重啟失敗";
      }
    });

    btnStartServer.addEventListener("click", async () => {
      overlayTitle.textContent = "正在啟動 Marimo...";
      btnStartServer.style.display = "none";
      try {
        await apiFetch("/api/start", { 
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            conversationId: currentConvId,
            workspaceUri: currentWorkspaceUri
          })
        });
        setTimeout(checkStatus, 1200);
      } catch (err) {
        overlayTitle.textContent = "啟動失敗";
        overlayDesc.textContent = err.message || "伺服器啟動失敗";
        btnStartServer.style.display = "inline-flex";
      }
    });

    btnExternal.addEventListener("click", () => {
      window.open(getTargetUrl(currentNotebook), "_blank");
    });

    // Sidecar Workspace Hook initialization
    const refreshWorkspaceUris = () => {
      if (window.sidecar && typeof window.sidecar.getWorkspaceUris === 'function') {
        window.sidecar.getWorkspaceUris().then(uris => {
          if (uris && uris.length > 0 && uris[0] !== currentWorkspaceUri) {
            syncWorkspace(uris[0]);
          }
        }).catch(console.warn);
      }
    };

    if (window.sidecar) {
      if (typeof window.sidecar.getWorkspaceUris === 'function') {
        window.sidecar.getWorkspaceUris().then(uris => {
          if (uris && uris.length > 0) {
            syncWorkspace(uris[0]);
          }
        }).catch(console.warn);
      }
      if (typeof window.sidecar.onWorkspaceChange === 'function') {
        window.sidecar.onWorkspaceChange((newUris) => {
          if (newUris && newUris.length > 0) {
            syncWorkspace(newUris[0]);
          }
        });
      }
    }

    // Auto re-sync workspace when user clicks back to this tab
    window.addEventListener('focus', refreshWorkspaceUris);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        refreshWorkspaceUris();
        checkStatus();
      }
    });

    // Start polling
    checkStatus();
    setInterval(checkStatus, 3000);
  </script>
</body>
</html>
